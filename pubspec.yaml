name: cableTvBook
description: A Cable TV operator management app for managing customers, areas, recharges, billing, and collections.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  intl: ^0.20.0
  validators: ^3.0.0
  file_picker: ^13.0.0
  fluttertoast: ^10.0.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^6.3.0
  pin_code_fields: ^8.0.1
  carousel_slider: ^5.0.0
  loading_indicator: ^4.0.0
  progress_indicators: ^1.0.0
  convex_bottom_bar: ^3.2.0
  flutter_svg: ^2.0.17
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#18181B"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/RobotoCondensed-Regular.ttf
        - asset: assets/fonts/RobotoCondensed-Italic.ttf
          style: italic
        - asset: assets/fonts/RobotoCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/RobotoCondensed-Light.ttf
          weight: 300
